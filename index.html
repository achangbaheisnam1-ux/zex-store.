<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zex Store</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Exo+2:ital,wght@1,800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;background:#F7F5FF}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
#app{--page:radial-gradient(900px 500px at 8% 12%,#E7E0FF 0%,rgba(231,224,255,0) 60%),radial-gradient(900px 600px at 100% 95%,#FFF1EA 0%,rgba(255,241,234,0) 60%),#F7F5FF;--surf:#FFFFFF;--surf2:#FAF9FF;--glass:rgba(255,255,255,.72);--tint:#ECE8FB;--tint2:#E9E4FC;--tint3:#F1EEFC;--sel:#F3F0FE;--hov:#EEEAFD;--line:#E6E2F7;--field:#FAF9FF;--fieldline:#E1DCF5;--ink:#15122E;--ink2:#3A3556;--mut:#6E6A8F;--mut2:#8A86A8;--acc:#5B3DDB;--acct:#5B3DDB;--accsoft:#7A63E8;--sh:rgba(91,61,219,.14);--sh2:rgba(91,61,219,.08);--track:#E4DEFA;--flashbg:#FFF7D6;--okbg:#EAF8EF;--okfg:#14663A;--warnbg:#FFF1D6;--warnfg:#8A5A00;min-height:100vh;background:var(--page);color:var(--ink)}
#app[data-theme="dark"]{--page:radial-gradient(900px 500px at 8% 12%,#2A2160 0%,rgba(42,33,96,0) 60%),radial-gradient(900px 600px at 100% 95%,#2A1A33 0%,rgba(42,26,51,0) 60%),#0F0D1F;--surf:#1A1733;--surf2:#15122B;--glass:rgba(26,23,51,.72);--tint:#27214A;--tint2:#2F2860;--tint3:#231E45;--sel:#262050;--hov:#26214A;--line:#2D2852;--field:#14112A;--fieldline:#383162;--ink:#F1EEFF;--ink2:#D4CFF2;--mut:#A8A3C8;--mut2:#8F8AB5;--acc:#6D50F2;--acct:#A99BFF;--accsoft:#7C63F0;--sh:rgba(0,0,0,.45);--sh2:rgba(0,0,0,.3);--track:#2D2852;--flashbg:#3A3010;--okbg:#12301F;--okfg:#7FE0A8;--warnbg:#3D2E0A;--warnfg:#FFD27A}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acct);outline-offset:2px}
.shell{display:flex;align-items:flex-start}
.rail{flex:none;width:64px;margin-top:80px;position:sticky;top:80px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;background:var(--surf);border-radius:0 18px 18px 0;box-shadow:0 8px 24px var(--sh2)}
.rail button{position:relative;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--mut2);display:flex;align-items:center;justify-content:center}
.rail button:hover{background:var(--hov)}
.rail button.on{background:var(--hov);color:var(--acct)}
.rail button.on::after{content:"";position:absolute;right:-11px;top:10px;width:3px;height:22px;border-radius:3px;background:var(--acct)}
.main{flex:1 1 0;min-width:0;padding:0 20px 48px}
.in{max-width:1100px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 0 6px}
.hdr.between{justify-content:space-between}
.logo{font-family:'Exo 2','Plus Jakarta Sans',sans-serif;font-style:italic;font-weight:800;font-size:26px;letter-spacing:.5px;color:var(--acct);white-space:nowrap;text-decoration:none}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--tint);color:var(--mut)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:0;border-radius:12px;background:var(--tint);color:var(--ink);font-size:12px;font-weight:700}
.round{width:36px;height:36px;border:0;border-radius:50%;background:var(--tint);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.signin{display:flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 10px;border:0;border-radius:12px;background:var(--tint);color:var(--ink);font-size:12px;font-weight:700}
.signin i{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.menuwrap{position:relative}
.scrim{position:fixed;inset:0;z-index:40;border:0;background:transparent;cursor:default}
.menu{position:absolute;left:0;right:auto;top:44px;max-width:calc(100vw - 32px);z-index:50;min-width:200px;padding:6px;border-radius:14px;background:var(--surf);box-shadow:0 16px 40px var(--sh),0 0 0 1px var(--line)}
.menu button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:13px;font-weight:600;text-align:left}
.menu button.on{background:var(--tint2);font-weight:800}
.menu button span+span{color:var(--acct);font-size:12px}
.top{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px}
.hero{flex:2 1 520px;min-width:0;aspect-ratio:2.48/1;border-radius:22px;overflow:hidden;box-shadow:0 14px 34px rgba(91,61,219,.22);position:relative}
.hero svg,.abs{position:absolute;inset:0;width:100%;height:100%}
.trend{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.trend h2{margin:0;font-size:17px;font-weight:700}
.titem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surf);box-shadow:0 4px 14px var(--sh2);border-left:3px solid}
.thumb{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.titem .tx{flex:1;min-width:0}
.titem b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;height:28px;padding:0 14px;display:flex;align-items:center;border-radius:999px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;text-decoration:none}
.flash{margin-top:36px;padding:26px 24px 24px;border-radius:26px;background:var(--glass);box-shadow:0 0 0 1px var(--line)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.fh h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.6px}
.cd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.cd em{font-style:normal;min-width:34px;padding:4px 6px;text-align:center;border-radius:8px;background:var(--flashbg);box-shadow:0 0 0 1.5px #F4C430;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.hov{transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.hov:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(91,61,219,.28)}}
.fcard{min-width:0;padding:14px;border-radius:16px;background:var(--surf);box-shadow:0 4px 16px var(--sh2);display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.fcard .row{display:flex;align-items:center;gap:8px}
.fcard .mini{flex:none;width:56px;height:34px;border-radius:8px}
.bar{position:relative;height:20px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#5B3DDB,#9B7BFF)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.crumb{font-size:10px;font-weight:600;letter-spacing:.6px;color:var(--mut)}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.ghead h2{margin:0;font-size:30px;font-weight:800;letter-spacing:.3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{height:32px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.3px}
.tabs button.on{background:var(--tint2);color:var(--acct)}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gcard{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:152/200;text-decoration:none;box-shadow:0 6px 18px var(--sh)}
.gcard{aspect-ratio:16/10.5}.gcard .lt{position:absolute;left:10px;right:10px;top:10px;bottom:56px;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}.gcard .cap{position:absolute;left:0;right:0;bottom:0;padding:9px 14px 10px;background:var(--surf)}
.gcard .cap b{display:block;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .cap small{display:block;font-size:10px;color:var(--acct);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin-top:48px}
.sh{border-left:4px solid var(--acct);padding-left:16px;margin-bottom:20px}
.sh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.4px}
.sh div{margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--acct)}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:var(--line);border-radius:4px;overflow:hidden}
.cells>div{background:var(--surf2);padding:26px 24px 28px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cells .ic{display:flex;align-items:center;gap:10px}
.cells .ic span{width:32px;height:32px;border-radius:50%;background:var(--tint2);color:var(--acct);display:flex;align-items:center;justify-content:center}
.cells .ic small{font-size:10px;font-weight:700;color:var(--acct)}
.cells h3{margin:6px 0 0;font-size:16px;font-weight:800}
.cells p,.mutp{margin:0;font-size:12px;line-height:1.65;color:var(--mut)}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.news article{min-width:0;border-radius:16px;overflow:hidden;background:var(--surf);box-shadow:0 6px 20px var(--sh2)}
.news .img{position:relative;aspect-ratio:16/8.6;overflow:hidden}
.news .tag{position:absolute;left:10px;top:10px;padding:3px 9px;border-radius:6px;background:#5B3DDB;color:#fff;font-size:9px;font-weight:800;letter-spacing:.5px}
.news .body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:8px}
.news .date{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mut)}
.news h3{margin:0;font-size:13px;font-weight:700;line-height:1.45}
.foot{margin-top:48px;padding:32px 32px 18px;border-radius:26px;background:var(--surf);box-shadow:0 8px 30px var(--sh2)}
.fcols{display:flex;gap:32px 48px;flex-wrap:wrap;justify-content:space-between}
.fcols h4{margin:0 0 3px;font-size:10px;font-weight:800;letter-spacing:.8px}
.fcols nav{display:flex;flex-direction:column;gap:9px;min-width:110px}
.ftl{color:var(--mut);text-decoration:none;font-size:12px}
.ftl:hover{color:var(--acct)}
.chip{padding:5px 10px;border-radius:6px;background:var(--tint3);color:var(--acct);font-size:10px;font-weight:700}
.store{display:flex;flex-direction:column;justify-content:center;height:34px;padding:0 14px;border-radius:8px;background:#111;color:#fff;text-decoration:none;line-height:1.15;box-shadow:0 0 0 1px var(--line)}
.soc{width:28px;height:28px;border-radius:50%;background:var(--hov);color:var(--acct);display:flex;align-items:center;justify-content:center}
.fbot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--mut)}

/* banner */
.bn{margin-top:22px}
.bn .bhero{position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:18px}
.bn .bhero.grabbing{cursor:grabbing}
.bn .track{display:flex;gap:14px;transition:transform .85s cubic-bezier(.22,.8,.2,1);will-change:transform}
.bn .slide{flex:0 0 78%;height:270px;border-radius:16px;position:relative;overflow:hidden;opacity:.45;transition:opacity .6s ease;display:flex;align-items:center;padding:0 44px}
.bn .slide.active{opacity:1}
.bn .slide::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 50%,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.bn .txt{position:relative;z-index:2;max-width:46%}
.bn .slide h2{margin:0 0 18px;font-family:'Chakra Petch','Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;font-size:30px;font-weight:700;line-height:1.15;color:#fff;text-wrap:balance}
.bn .cta{display:inline-block;background:#ff7a00;padding:10px 22px;border-radius:8px;cursor:pointer;font-family:'Chakra Petch','Noto Sans Devanagari',sans-serif;font-weight:700;font-size:17px;box-shadow:0 6px 0 #b85400;color:#fff;text-decoration:none;border:0}
.bn .cta:active{transform:translateY(3px);box-shadow:0 3px 0 #b85400}
.bn .logo-card{position:absolute;right:16px;top:16px;bottom:16px;width:46%;border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.15)}
.bn .logo-card img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.bn .slide.active h2{animation:bnUp .9s cubic-bezier(.16,.84,.24,1) .15s backwards}
.bn .slide.active .logo-card{animation:bnCard .9s cubic-bezier(.16,.84,.24,1) .05s backwards}
.bn .slide.active .cta{animation:bnUp .8s cubic-bezier(.16,.84,.24,1) .4s backwards}
@keyframes bnUp{from{opacity:0;transform:translate3d(0,22px,0)}}
@keyframes bnCard{from{opacity:0;transform:translate3d(48px,0,0) scale(.96)}}
.bn .dots{display:flex;justify-content:center;gap:5px;margin-top:14px}
.bn .dot{width:6px;height:4px;border-radius:4px;background:var(--mut2);opacity:.5;cursor:pointer;transition:.3s;padding:0;border:0}
.bn .dot.active{width:16px;background:#ff7a00;opacity:1}
.rv{margin-top:30px;display:none}
.rv.open{display:block}
.round.on{background:var(--acc);color:#fff}
.rv h3{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rv .clear{font-family:inherit;font-size:10px;color:#e0413f;background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.35);padding:4px 9px;border-radius:5px;cursor:pointer;font-weight:600}
.rv .list{display:flex;gap:10px;flex-wrap:wrap}
.rv .item{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);padding:9px 40px 9px 9px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .2s}
.rv .item:hover{border-color:#ff7a00}
.rv .item small{display:block;color:var(--mut);font-size:10px;margin-top:2px;font-weight:500}
.rv .empty{color:var(--mut);font-size:12px}
.rv .icon{width:84px;height:46px;border-radius:9px;padding:6px 8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.rv .icon img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.titems{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:900px){
 .bn .logo-card{left:12px;right:12px;top:12px;bottom:auto;width:auto;height:100px;padding:8px 14px;border-radius:12px}
 .bn .slide{flex:0 0 88%;padding:0 18px 18px;height:262px;align-items:flex-end}
 .bn .slide h2{font-size:21px;margin-bottom:12px}
 .bn .cta{font-size:15px;padding:8px 18px}
 .bn .txt{max-width:100%}
}
@media(prefers-reduced-motion:reduce){.bn .slide.active h2,.bn .slide.active .logo-card,.bn .slide.active .cta{animation:none}.bn .track{transition:none}}

.lg{max-width:820px;margin:0 auto}
.lg h1{margin:6px 0 4px;font-size:34px;font-weight:800}
.lg .upd{font-size:12px;color:var(--mut);margin-bottom:22px}
.lg .doc{padding:28px;border-radius:22px;background:var(--surf);box-shadow:0 8px 28px var(--sh2)}
.lg .doc h2{margin:26px 0 8px;font-size:16px;font-weight:800;color:var(--acct)}
.lg .doc h2:first-child{margin-top:0}
.lg .doc p{margin:0 0 10px;font-size:13px;line-height:1.8;color:var(--ink2)}
.lg .doc ul{margin:0 0 10px;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:22px}
.ccard{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:20px;background:var(--surf);box-shadow:0 6px 20px var(--sh2);text-decoration:none;color:inherit;min-width:0}
.ccard .ci{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.ccard b{font-size:15px}
.ccard span{font-size:13px;color:var(--acct);font-weight:700;overflow-wrap:anywhere}
.ccard small{font-size:11px;color:var(--mut);line-height:1.6}
/* product */
.pcrumb{font-size:11px;color:var(--mut);margin:10px 0 14px}
.phero{position:relative;overflow:hidden;border-radius:26px;padding:34px;color:#fff;box-shadow:0 16px 36px rgba(91,61,219,.25)}
.phero .row{position:relative;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.phero .badge{flex:none;width:112px;height:112px;border-radius:26px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.phero h1{margin:4px 0 2px;font-size:38px;font-weight:800;line-height:1.2;text-wrap:balance}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tagrow span{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:11px;font-weight:700}
.order{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:26px}
.steps{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.box{padding:22px;border-radius:20px;background:var(--surf);box-shadow:0 6px 20px var(--sh2)}
.box h2{margin:0;font-size:16px;font-weight:800}
.box .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.num{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fields{display:flex;gap:12px;flex-wrap:wrap}
.fields>div{min-width:0;display:flex;flex-direction:column;gap:6px}
label.l{font-size:12px;font-weight:700}
.in2{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--fieldline);border-radius:12px;background:var(--field);font-family:inherit;font-size:14px;color:var(--ink)}
.in2::placeholder{color:var(--mut)}
.in2:focus{border-color:var(--acct);outline:0}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pack{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink)}
.pack.on,.pay.on{border-color:var(--acct);background:var(--sel)}
.pack b{font-size:14px;font-weight:800}
.pack .pr{font-size:13px;font-weight:800;color:var(--acct)}
.pack .old{display:flex;align-items:center;gap:6px;font-size:10px}
.pack .old s{color:var(--mut2)}
.pack .old em{font-style:normal;padding:1px 6px;border-radius:5px;background:var(--warnbg);color:var(--warnfg);font-weight:800}
.pack .bon{font-size:10px;font-weight:700;color:var(--okfg)}
.pays{display:flex;flex-direction:column;gap:10px}
.pay{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink)}
.pay .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--acct);display:flex;align-items:center;justify-content:center}
.pay .dot i{width:8px;height:8px;border-radius:50%;background:transparent}
.pay.on .dot i{background:var(--acct)}
.pay span.n{flex:1;min-width:0;font-size:13px;font-weight:700}
.pay small{font-size:11px;color:var(--mut)}

      '<div class="fld"><label class="l" for="lg-pass">' + esc(t.password) + '</label><div class="pw"><input class="in2" id="lg-pass" type="' + (S.show ? 'text' : 'password') + '" placeholder="' + esc(t.pwPh) + '" autocomplete="' + (reg ? 'new-password' : 'current-password') + '" style="padding-right:96px"><button type="button" data-a="show">' + esc(S.show ? t.hide : t.show) + '</button></div></div>' +
      (!reg ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><label for="lg-rem" style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);cursor:pointer"><input id="lg-rem" type="checkbox" checked style="width:16px;height:16px;accent-color:#6D50F2;margin:0">' + esc(t.remember) + '</label><a href="#/" style="font-size:12px;font-weight:700;color:var(--acct);text-decoration:none">' + esc(t.forgot) + '</a></div>' : '') + '</div>' +
      '<button type="button" class="btnp" data-a="submit"' + (S.busy ? ' disabled' : '') + '>' + esc(S.busy ? t.authBusy : (reg ? t.btnUp : t.signIn)) + '</button>' + (S.authErr ? '<div class="ok bad" style="margin:0" role="alert">' + esc(S.authErr) + '</div>' : '') +
      '<div class="or"><i></i>' + esc(t.orWord) + '<i></i></div><div style="display:flex;flex-direction:column;gap:10px"><div id="g-btn" style="display:flex;justify-content:center;min-height:44px">' + (GCID ? '' : '<button type="button" class="btno" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px" data-a="gsetup">' + GICON + esc(t.google) + '</button>') + '</div></div>' +
      '<p class="mutp" style="margin-top:auto;font-size:11px;line-height:1.7">' + esc(t.lgTerms) + '</p></aside></div>';
  }

  /* ---------- GOOGLE LOGIN + CUSTOMER DASHBOARD ---------- */
  var GCID = ''; /* paste your Google OAuth "Web client ID" here to turn on Continue with Google */
  var GICON = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
  var gReady = false;
  function isAdmin() { return !!(S.user && (S.user.role === 'admin' || S.user.isAdmin)); }
  function inr(n) { return '\u20B9' + (Number(n) || 0).toLocaleString('en-IN'); }
  function backBtn(t) {
    return '<button type="button" class="bk2" data-a="back" aria-label="' + esc(t.back) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>' + esc(t.back) + '</button>';
  }
  function mountGoogle() {
    var box = document.getElementById('g-btn');
    if (!box || !GCID) return;
    function draw() {
      if (!window.google || !google.accounts) return;
      var b = document.getElementById('g-btn'); if (!b) return;
      if (!gReady) { google.accounts.id.initialize({ client_id: GCID, callback: onGoogle }); gReady = true; }
      google.accounts.id.renderButton(b, { type: 'standard', theme: S.dark ? 'filled_black' : 'outline', size: 'large', text: 'continue_with', shape: 'pill', width: Math.min(400, Math.max(200, b.clientWidth || 364)) });
    }
    var s = document.getElementById('gsi');
    if (window.google && google.accounts) draw();
    else if (s) s.addEventListener('load', draw);
    else { s = document.createElement('script'); s.id = 'gsi'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = draw; document.head.appendChild(s); }
  }
  function onGoogle(resp) {
    var t = Z.dict(S.lang);
    if (!resp || !resp.credential) { S.authErr = t.gFail; render(); return; }
    S.busy = true; S.authErr = ''; render();
    fetch('/api/auth/google', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        S.busy = false;
        if (x.ok && x.j && x.j.status === 'success') { S.user = x.j.user; S.loginOpen = false; S.acct = null; }
        else S.authErr = t.gFail;
        render();
      })
      .catch(function () { S.busy = false; S.authErr = t.authOff; render(); });
  }
  function loadAcct() {
    S.acct = { s: 'loading', orders: [] };
    fetch('/api/account/orders', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) { S.acct = { s: 'ok', orders: (j && j.orders) || [] }; render(); })
      .catch(function () { S.acct = { s: 'err', orders: [] }; render(); });
  }
  function savePw() {
    var t = Z.dict(S.lang), g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    var c = g('pw-cur'), n = g('pw-new'), n2 = g('pw-new2');
    if (S.pwBusy) return;
    if (!c || !n || !n2) { S.pwMsg = { bad: 1, text: t.authNeed }; render(); return; }
    if (n.length < 8) { S.pwMsg = { bad: 1, text: t.authWeak }; render(); return; }
    if (n !== n2) { S.pwMsg = { bad: 1, text: t.pwMismatch }; render(); return; }
    S.pwBusy = true; S.pwMsg = null; render();
    fetch('/api/account/password', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ current: c, password: n }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        S.pwBusy = false;
        if (x.ok && x.j && x.j.status === 'success') { S.pwMsg = { text: t.pwDone }; S.pwOpen = false; }
        else S.pwMsg = { bad: 1, text: x.j && x.j.code === 'bad_creds' ? t.pwWrong : t.pwFail };
        render();
      })
      .catch(function () { S.pwBusy = false; S.pwMsg = { bad: 1, text: t.authOff }; render(); });
  }
  function pwField(id, label, ac) {
    return '<div class="fld"><label class="l" for="' + id + '">' + esc(label) + '</label><input class="in2" id="' + id + '" type="password" autocomplete="' + ac + '"></div>';
  }
  function account(t) {
    var head = '<header class="hdr between stk"><a class="logo" href="#/">ZEX STORE</a><nav class="tools" aria-label="' + esc(t.navAria) + '"><a href="#/" style="font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none">' + esc(t.home) + '</a>' + langMenu(t) + themeBtn(t) + signBtn(t) + '</nav></header>';
    var crumb = '<div class="pcrumb crow">' + backBtn(t) + '<span><a class="ftl" href="#/" style="font-size:11px">' + esc(t.home) + '</a> <span style="margin:0 6px">/</span> <b style="color:var(--acct)">' + esc(t.myAcct) + '</b></span></div>';
    var body;
    if (!S.user) {
      body = '<div class="box"><p class="mutp" style="font-size:14px">' + esc(t.acNeedLogin) + '</p><button type="button" class="btnp" style="margin-top:14px;padding:0 22px" data-a="login">' + esc(t.signIn) + '</button></div>';
    } else if (isAdmin()) {
      body = '<div class="box"><p class="mutp" style="font-size:14px;line-height:1.7">' + esc(t.acAdminNote) + '</p><a class="btnp" style="margin-top:14px;display:inline-flex;align-items:center;padding:0 22px;text-decoration:none" href="/admin">' + esc(t.adminPanel) + '</a></div>';
    } else {
      var A = S.acct || { s: 'loading' }, o = A.orders || [], spent = 0, done = 0;
      var SP = { paid: 1, processing: 1, completed: 1, delivered: 1, success: 1 }, DN = { completed: 1, delivered: 1, success: 1 };
      o.forEach(function (x) { var s = String(x.status || '').toLowerCase(); if (SP[s]) spent += Number(x.amount) || 0; if (DN[s]) done++; });
      var ready = A.s === 'ok', nm = S.user.name || S.user.user;
      var rows = o.slice(0, 30).map(function (x) {
        var s = String(x.status || '').toLowerCase(), cls = DN[s] ? 'ok' : (/fail|cancel|refund|reject/.test(s) ? 'bad' : 'warn');
        var d = x.createdAt ? new Date(x.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        return '<div class="orow"><div class="ot"><b>' + esc(x.game || '') + ' · ' + esc(x.item || '') + '</b><small>' + esc(d) + '</small></div><b style="font-size:13px">' + esc(inr(x.amount)) + '</b><span class="st ' + cls + '">' + esc(x.status || '') + '</span></div>';
      }).join('');
      var list = A.s === 'loading' ? '<p class="mutp">' + esc(t.acLoading) + '</p>' : A.s === 'err' ? '<p class="mutp" style="color:#b42318">' + esc(t.acErr) + '</p>' : !o.length ? '<p class="mutp">' + esc(t.acNone) + '</p>' : rows;
      body = '<div class="box dprof"><div class="dav">' + esc(String(nm).charAt(0).toUpperCase()) + '</div><div style="flex:1 1 200px;min-width:0"><h2 style="margin:0;font-size:20px">' + esc(Z.f(t.acHi, { name: nm })) + '</h2><p class="mutp" style="margin-top:4px">' + esc(S.user.user || '') + '</p></div><button type="button" class="btno" data-a="logout">' + esc(t.signOut) + '</button></div>' +
        '<div class="dstats"><div class="dstat"><small>' + esc(t.acSpent) + '</small><b>' + (ready ? esc(inr(spent)) : '—') + '</b></div><div class="dstat"><small>' + esc(t.acOrders) + '</small><b>' + (ready ? o.length : '—') + '</b></div><div class="dstat"><small>' + esc(t.acDone) + '</small><b>' + (ready ? done : '—') + '</b></div></div>' +
        '<div class="box"><div class="hd"><h2>' + esc(t.acRecent) + '</h2></div>' + list + '</div>' +
        '<div class="box"><div class="hd"><h2>' + esc(t.acSec) + '</h2></div>' + (S.pwMsg ? '<div class="ok' + (S.pwMsg.bad ? ' bad' : '') + '" style="margin:0 0 12px" role="status">' + esc(S.pwMsg.text) + '</div>' : '') +
        (S.pwOpen ? '<div class="stack" style="max-width:420px">' + pwField('pw-cur', t.pwCur, 'current-password') + pwField('pw-new', t.pwNew, 'new-password') + pwField('pw-new2', t.pwNew2, 'new-password') + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btnp" style="padding:0 22px" data-a="pwsave"' + (S.pwBusy ? ' disabled' : '') + '>' + esc(t.pwSave) + '</button><button type="button" class="btno" data-a="pwtoggle">' + esc(t.pwCancel) + '</button></div></div>'
          : '<button type="button" class="btno" data-a="pwtoggle">' + esc(t.pwEdit) + '</button>') + '</div>';
    }
    return '<div class="main"><div class="in">' + head + crumb + '<div class="dash">' + body + '</div>' +
      '<footer class="pfoot"><a class="logo" style="font-size:18px" href="#/">ZEX STORE</a><span class="mutp" style="font-size:11px">' + esc(t.rights) + '</span></footer></div></div>';
  }

  /* ---------- AUTH ---------- */
  function authText(code, t) {
    return ({ exists: t.authExists, bad_creds: t.authBad, weak: t.authWeak, invalid: t.authInvalid, limit: t.authLimit })[code] || t.authBad;
  }
  function doAuth() {
    if (S.busy) return;
    var t = Z.dict(S.lang), reg = S.mode === 'register';
    var gv = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
    var n = gv('lg-name').trim(), u = gv('lg-user').trim(), p = gv('lg-pass');
    var remEl = document.getElementById('lg-rem'), rem = remEl ? remEl.checked : true;
    if (!u || !p || (reg && !n)) { S.authErr = t.authNeed; render(); return; }
    if (reg && p.length < 8) { S.authErr = t.authWeak; render(); return; }
    S.authErr = ''; S.busy = true; render();
    fetch('/api/auth/' + (reg ? 'register' : 'login'), { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: n, user: u, password: p, remember: rem }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        S.busy = false;
        if (x.ok && x.j && x.j.status === 'success') { S.user = x.j.user; S.loginOpen = false; S.authErr = ''; }
        else S.authErr = authText(x.j && x.j.code, t);
        render();
      })
      .catch(function () { S.busy = false; S.authErr = t.authOff; render(); });
  }

  /* ---------- render ---------- */
  function render() {
    var t = Z.dict(S.lang);
    var saved = {}, active = document.activeElement && document.activeElement.id;
    var sel = null;
    app.querySelectorAll('input').forEach(function (el) { if (el.id) saved[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
    if (active && document.activeElement.selectionStart != null) sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd];
    S.slug = route(); S.page = pageRoute();
    var rk = S.page || S.slug || 'home', fresh = S.lastRk !== undefined && S.lastRk !== rk; S.lastRk = rk;
    app.setAttribute('data-theme', S.dark ? 'dark' : 'light');
    document.documentElement.lang = S.lang;
    document.title = (S.page ? (S.page === 'contact' ? 'Contact Us' : S.page === 'pay' ? 'Pay' : PAGES[S.page].title) + ' · ' : S.slug ? G[S.slug].name + ' · ' : '') + 'Zex Store';
    banner.unmount();
    app.innerHTML = (S.page === 'pay' ? payPage(t) : S.page === 'account' ? account(t) : S.page ? legal(t, S.page) : S.slug ? product(t) : home(t)) + (S.loginOpen ? login(t) : '');
    var bh = document.getElementById('bnhost'); if (bh) banner.mount(bh, S.lang);
    if (fresh) { var mm = app.querySelector('.main'); if (mm) mm.classList.add('pgin'); }
    if (S.loginOpen) mountGoogle();
    if (S.page === 'account' && S.user && !isAdmin() && !S.acct) loadAcct();
    app.querySelectorAll('input').forEach(function (el) {
      if (el.id in saved) { if (el.type === 'checkbox') el.checked = saved[el.id]; else el.value = saved[el.id]; }
    });
    if (active) { var el = document.getElementById(active); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  }

  app.addEventListener('input', function (e) {
    if (!S.chk || (e.target.id !== 'pid' && e.target.id !== 'srv')) return;
    var p = (document.getElementById('pid') || {}).value || '', v = (document.getElementById('srv') || {}).value || '';
    if (S.chk.key !== p.trim() + '|' + v.trim()) { S.chk = null; render(); }
  });

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
    if (a === 'lang') { S.lang = v; Z.save(v); S.langOpen = false; }
    else if (a === 'langtoggle') S.langOpen = !S.langOpen;
    else if (a === 'langclose') S.langOpen = false;
    else if (a === 'rvtoggle') banner.toggleRv();
    else if (a === 'theme') { S.dark = !S.dark; try { localStorage.setItem('zex-theme', S.dark ? 'dark' : 'light'); } catch (x) {} }
    else if (a === 'login') { S.loginOpen = true; S.done = false; S.authErr = ''; }
    else if (a === 'logclose') S.loginOpen = false;
    else if (a === 'mode') { S.mode = v; S.done = false; S.authErr = ''; }
    else if (a === 'show') S.show = !S.show;
    else if (a === 'pwtoggle') { S.pwOpen = !S.pwOpen; S.pwMsg = null; }
    else if (a === 'pwsave') { savePw(); return; }
    else if (a === 'gsetup') S.authErr = Z.dict(S.lang).gSetup;
    else if (a === 'submit') { doAuth(); return; }
    else if (a === 'back') { if (S.nav > 0) { S.nav -= 2; S.backing = false; history.back(); } else location.hash = '#/'; return; }
    else if (a === 'logout') { fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(function () {}); S.user = null; S.acct = null; S.pwOpen = false; S.pwMsg = null; if (S.page === 'account') location.hash = '#/'; }
    else if (a === 'tab') S.tab = +v;
    else if (a === 'pack') { S.pack = +v; S.bought = false; }
    else if (a === 'pay') { S.pay = +v; S.bought = false; }
    else if (a === 'faq') S.faq = S.faq === +v ? -1 : +v;
    else if (a === 'chk') {
      var cp = (document.getElementById('pid') || {}).value || '', cs = (document.getElementById('srv') || {}).value || '';
      cp = cp.trim(); cs = cs.trim();
      if (!/^\d{4,15}$/.test(cp) || !/^\d{1,6}$/.test(cs)) { S.chk = { s: 'err', msg: Z.dict(S.lang).chkNeed, key: '' }; }
      else {
        var key = cp + '|' + cs;
        S.chk = { s: 'loading', key: key };
        fetch('/api/validasi?id=' + encodeURIComponent(cp) + '&serverid=' + encodeURIComponent(cs))
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!S.chk || S.chk.key !== key) return;
            if (x.ok && x.j && x.j.status === 'success') S.chk = { s: 'ok', key: key, nick: x.j.result.nickname, country: x.j.result.country };
            else S.chk = { s: 'err', key: key, msg: Z.dict(S.lang).chkBad };
            render();
          })
          .catch(function () { if (S.chk && S.chk.key === key) { S.chk = { s: 'err', key: key, msg: Z.dict(S.lang).chkOff }; render(); } });
      }
    }
    else if (a === 'buy') {
      var pidEl = document.getElementById('pid'), srvEl = document.getElementById('srv');
      var pidV = pidEl ? pidEl.value.trim() : '', srvV = srvEl ? srvEl.value.trim() : '';
      var emEl = document.getElementById('em'), pwEl = document.getElementById('pw'), emV = emEl ? emEl.value.trim() : '', pwV = pwEl ? pwEl.value : '', hsr = S.slug === 'honkai-star-rail';
      if (!pidV || (hsr && (emV.indexOf('@') < 1 || !pwV))) { S.bought = 'err'; S.errMsg = hsr ? (ZX[S.lang] || ZX.en).errHsr : ''; }
      else {
        var gm = G[S.slug], sp = document.querySelectorAll('.pack')[S.pack];
        var pq = sp ? sp.querySelector('b').textContent : '', pp = sp ? sp.querySelector('.pr').textContent : '';
        var verified = S.chk && S.chk.s === 'ok' && S.chk.key === pidV + '|' + srvV;
        S.order = { slug: S.slug, game: gm.name, pid: pidV, srv: srvV, email: emV, pwd: pwV, item: pq, priceText: pp, amt: parseInt(pp.replace(/[^0-9]/g, ''), 10) || 0, nick: verified ? S.chk.nick : '', country: verified ? S.chk.country : '', paid: false };
        S.bought = false; S.payErr = false; S.errMsg = '';
        location.hash = '#/pay';
      }
    }
    else if (a === 'payconfirm') {
      var o = S.order, ue = document.getElementById('utr'), uv = ue ? ue.value.trim() : '';
      if (o) {
        if (!/^[A-Za-z0-9]{8,22}$/.test(uv)) { S.payErr = true; }
        else {
          S.payErr = false;
          var wm = 'New top-up order' + (S.user ? '\nAccount: ' + (S.user.name || '') + ' (' + S.user.user + ')' : '') + '\nGame: ' + o.game + '\nPlayer ID: ' + o.pid + (o.email ? '\nHoYoverse Email: ' + o.email + '\nPassword: ' + o.pwd : '') + (o.srv ? '\nServer: ' + o.srv : '') + (o.nick ? '\nNickname: ' + o.nick + ' (' + o.country + ')' : '') + '\nItem: ' + o.item + '\nPrice: ' + o.priceText + '\nPayment: UPI\nUPI UTR: ' + uv;
          if (!isAdmin()) { if (S.user) S.acct = null; fetch('/api/orders', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: o.slug, game: o.game, playerId: o.pid, server: o.srv, item: o.item, amount: o.amt, utr: uv, payment: 'UPI' }) }).catch(function () {}); }
          o.wa = 'https://wa.me/' + String(PH.wa).replace(/\D/g, '') + '?text=' + encodeURIComponent(wm); if (!window.open(o.wa, '_blank')) { window.location.href = o.wa; }
          o.paid = true;
        }
      }
    }
    render();
  });

  fetch('/api/auth/me', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j && j.user) { S.user = j.user; render(); } }).catch(function () {});
  window.addEventListener('hashchange', function () { if (!S.backing) S.nav = (S.nav || 0) + 1; S.pack = 1; S.bought = false; S.acct = null; S.pwOpen = false; S.pwMsg = null; S.chk = null; S.langOpen = false; render(); window.scrollTo(0, 0); if (S.slug) goPacks(); });
  if (route()) goPacks();

  setInterval(function () {
    S.left = Math.max(0, S.left - 1);
    var h = document.getElementById('cdh');
    if (!h) return;
    var p = function (n) { return String(n).padStart(2, '0'); };
    h.textContent = p(Math.floor(S.left / 3600));
    document.getElementById('cdm').textContent = p(Math.floor((S.left % 3600) / 60));
    document.getElementById('cds').textContent = p(S.left % 60);
  }, 1000);

  render();
})();
</script>
